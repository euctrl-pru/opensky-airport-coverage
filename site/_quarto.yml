project:
  type: website
  output-dir: _site

website:
  title: "OpenSky airport coverage"
  description: "ADS-B coverage per aerodrome, measured from OPDI track boundary error"
  navbar:
    left:
      - href: index.qmd
        text: Rankings
      - href: pipeline.qmd
        text: Pipeline
      - href: metrics.qmd
        text: Metrics
      - href: about.qmd
        text: About
  page-footer:
    center: "EUROCONTROL PRU · Open Performance Data Initiative"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    df-print: paged
    code-fold: true
    code-summary: "code"
    fig-format: svg

execute:
  echo: false
  warning: false
  freeze: false
  # **Kernel reuse, and it is not optional at this page count.** With
  # `daemon: false` Quarto starts a fresh Python kernel for every file: the
  # 424-page render managed four pages in seven minutes, which extrapolates to
  # over ten hours and would time out in CI. The pages import the same three
  # modules and draw through the same matplotlib Agg backend, so there is
  # nothing here for a fresh kernel to isolate.
  daemon: true

execute-dir: project
